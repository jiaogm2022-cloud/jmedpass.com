<!DOCTYPE html>
<html lang="zh-CN" data-page="login">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>登录 / 注册 · 日医通合伙人</title>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="partner.css" />
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <a href="/" style="text-decoration:none;">
        <span class="logo-icon" style="font-size:2rem;">⚕</span>
        <span class="login-logo-name" data-i18n="login.brand">日医通</span>
        <span class="login-logo-sub" data-i18n="login.brandSub">JMEDPASS · 合伙人平台</span>
      </a>
    </div>

    <div class="lang-switcher" style="justify-content:center;margin-bottom:16px;background:rgba(0,0,0,.06);">
      <button class="lang-btn active" data-lang="zh">中文</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="ja">JP</button>
      <button class="lang-btn" data-lang="vi">VI</button>
      <button class="lang-btn" data-lang="ko">KR</button>
    </div>

    <!-- 推荐人提示 -->
    <div class="auth-notice" id="refNotice"></div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <div class="auth-tab" id="tabLogin" onclick="switchTab('login')" data-i18n="login.tabLogin">登录</div>
      <div class="auth-tab" id="tabRegister" onclick="switchTab('register')" data-i18n="login.tabRegister">注册成为合伙人</div>
    </div>

    <!-- 登录表单 -->
    <form class="auth-form" id="loginForm">
      <div class="auth-field">
        <label data-i18n="login.phoneLabel">手机号 / 邮箱</label>
        <input type="text" id="loginPhone" data-i18n-ph="login.phonePh" placeholder="输入注册时使用的手机号或邮箱" autocomplete="username" />
      </div>
      <div class="auth-field">
        <label data-i18n="login.pwdLabel">密码</label>
        <input type="password" id="loginPassword" data-i18n-ph="login.pwdPh" placeholder="输入密码" autocomplete="current-password" />
      </div>
      <div class="auth-error" id="loginError"></div>
      <button type="submit" class="auth-submit" data-i18n="login.submitLogin">登录</button>
      <p style="font-size:.82rem;text-align:right;margin-top:10px;">
        <a href="javascript:void(0)" id="forgotPasswordLink" style="color:var(--accent);text-decoration:none;" data-i18n="login.forgot">忘记密码？</a>
      </p>
    </form>

    <!-- 注册表单 -->
    <form class="auth-form" id="registerForm">
      <div class="auth-field">
        <label data-i18n="login.nickLabel">昵称</label>
        <input type="text" id="regNickname" data-i18n-ph="login.nickPh" placeholder="您的昵称（显示给客户）" maxlength="30" />
      </div>
      <div class="auth-field">
        <label data-i18n="login.regPhoneLabel">手机号 / WhatsApp</label>
        <input type="tel" id="regPhone" data-i18n-ph="login.regPhonePh" placeholder="如 +65 8888 8888" />
      </div>
      <div class="auth-field">
        <label data-i18n="login.emailLabel">邮箱</label>
        <input type="email" id="regEmail" data-i18n-ph="login.emailPh" placeholder="your@email.com" required />
      </div>
      <div class="auth-field">
        <label data-i18n="login.pwdLabel">设置密码</label>
        <input type="password" id="regPassword" data-i18n-ph="login.pwdPh" placeholder="至少8位" autocomplete="new-password" />
      </div>
      <div class="auth-field">
        <label>确认密码</label>
        <input type="password" id="regPasswordConfirm" placeholder="再次输入密码" autocomplete="new-password" />
      </div>
      <div class="auth-field">
        <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;">
          <input type="checkbox" id="regAgree" style="margin-top:4px;" />
          <span style="font-size:.88rem;line-height:1.6;color:var(--mid);">
            我已阅读并同意<a href="/terms" target="_blank" style="color:var(--accent);text-decoration:underline;">合伙人计划说明</a>、<a href="/privacy" target="_blank" style="color:var(--accent);text-decoration:underline;">隐私政策</a>及佣金规则；本计划仅为单级推荐奖励。
          </span>
        </label>
      </div>
      <div class="auth-error" id="registerError"></div>
      <button type="submit" class="auth-submit" data-i18n="login.submitRegister">注册，立即成为合伙人</button>
      <p style="font-size:.8rem;color:var(--muted);margin-top:12px;text-align:center;" data-i18n="login.agreement">
        注册即代表您同意本平台合伙人协议，佣金仅为单级推荐，非多层次直销。
      </p>
    </form>

    <div class="auth-back">
      <a href="/partner" data-i18n="login.back">← 返回合伙人介绍页</a>
    </div>

  </div>
</div>

<div class="partner-toast" id="toast"></div>

<script src="i18n.js?v=5"></script>
<script src="partner.js"></script>
<script>
// ===== Translation helper =====
function t(key, fallback) {
  if (typeof I18N !== 'undefined' && typeof _currentLang !== 'undefined' && I18N[_currentLang] && I18N[_currentLang][key]) {
    return I18N[_currentLang][key];
  }
  return fallback;
}

// ===== Read URL params =====
const params = new URLSearchParams(location.search);
const refCode = params.get('ref') || localStorage.getItem('sm_pending_ref') || '';
const tabParam = params.get('tab');

fetch('/api/partner-session', { credentials: 'same-origin' })
  .then(function (response) { return response.json(); })
  .then(function (data) {
    if (data && data.authenticated) {
      window.location.href = '/my';
    }
  })
  .catch(function () {});

// Show referrer notice
if (refCode) {
  const notice = document.getElementById('refNotice');
  notice.textContent = '您正在通过推荐链接注册，完成注册后推荐关系会自动绑定。';
  notice.classList.add('show');
  localStorage.setItem('sm_pending_ref', refCode);
  localStorage.setItem('sm_pending_ref_at', Date.now().toString());
}

// Default tab
switchTab(tabParam === 'register' ? 'register' : 'login');

function switchTab(tab) {
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
  document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
  document.getElementById('loginForm').classList.toggle('active', tab === 'login');
  document.getElementById('registerForm').classList.toggle('active', tab === 'register');
}

async function hashPassword(password) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(password));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function normalizePhoneInput(value) {
  return String(value || '')
    .trim()
    .replace(/[^\d+]/g, '')
    .replace(/(?!^)\+/g, '');
}

function isValidPhoneInput(value) {
  return /^\+?\d{6,15}$/.test(normalizePhoneInput(value));
}

async function doLogin(e) {
  e.preventDefault();
  const phone = document.getElementById('loginPhone').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');

  if (!phone || !password) { showAuthError(errEl, t('login.err.required', '请填写所有必填项')); return; }
  try {
    const response = await fetch('/api/partner-login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier: phone, password }),
    });
    const data = await response.json();
    if (!response.ok) {
      showAuthError(errEl, data.error || t('login.err.wrongPwd', '账号或密码错误，请检查后重试'));
      return;
    }
    showToastMsg(t('login.msg.loginOk', '登录成功，正在跳转…'), 'success');
    setTimeout(() => { window.location.href = '/my'; }, 800);
  } catch (error) {
    showAuthError(errEl, '登录失败，请稍后重试');
  }
}

async function doRegister(e) {
  e.preventDefault();
  const submitBtn = document.querySelector('#registerForm .auth-submit');
  const defaultLabel = submitBtn.textContent;
  const nickname = document.getElementById('regNickname').value.trim();
  const phone = normalizePhoneInput(document.getElementById('regPhone').value);
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const confirmPassword = document.getElementById('regPasswordConfirm').value;
  const agreeTerms = document.getElementById('regAgree').checked;
  const errEl = document.getElementById('registerError');

  if (!nickname) { showAuthError(errEl, t('login.err.nickRequired', '请填写昵称')); return; }
  if (!phone) { showAuthError(errEl, t('login.err.phoneRequired', '请填写手机号')); return; }
  if (!isValidPhoneInput(phone)) { showAuthError(errEl, '请输入有效的手机号或 WhatsApp 号码'); return; }
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showAuthError(errEl, '请填写有效的邮箱地址'); return; }
  if (password.length < 8) { showAuthError(errEl, '密码至少需要8位'); return; }
  if (password !== confirmPassword) { showAuthError(errEl, '两次输入的密码不一致'); return; }
  if (!agreeTerms) { showAuthError(errEl, '请先同意合伙人协议与隐私说明'); return; }

  try {
    submitBtn.disabled = true;
    submitBtn.textContent = '注册中…';
    const response = await fetch('/api/partner-register', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nickname,
        phone,
        email,
        password,
        confirmPassword,
        agreeTerms,
        referralCode: refCode || localStorage.getItem('sm_pending_ref') || '',
        referralToken: localStorage.getItem('sm_pending_ref_token') || '',
      }),
    });
    const data = await response.json();
    if (!response.ok) {
      showAuthError(errEl, data.error || '注册失败，请稍后重试');
      submitBtn.disabled = false;
      submitBtn.textContent = defaultLabel;
      return;
    }

    localStorage.removeItem('sm_pending_ref');
    localStorage.removeItem('sm_pending_ref_at');
    showToastMsg(t('login.msg.registerOk', '注册成功！欢迎成为日医通合伙人'), 'success');
    setTimeout(() => { window.location.href = '/my?new=1'; }, 1000);
  } catch (error) {
    showAuthError(errEl, '注册失败，请稍后重试');
    submitBtn.disabled = false;
    submitBtn.textContent = defaultLabel;
  }
}

function showAuthError(el, msg) {
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3500);
}

function showToastMsg(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'partner-toast show' + (type ? ' ' + type : '');
  setTimeout(() => { t.className = 'partner-toast'; }, 2500);
}

document.getElementById('loginForm').addEventListener('submit', doLogin);
document.getElementById('registerForm').addEventListener('submit', doRegister);

// Forgot password — prompt user to contact support
document.getElementById('forgotPasswordLink').addEventListener('click', function () {
  var phone = document.getElementById('loginPhone').value.trim();
  var msg = phone
    ? '请通过 WhatsApp (+65 8942 7926) 或邮件 (admin@jmedpass.com) 联系客服，提供您的注册手机号 ' + phone + ' 进行密码重置。'
    : '请通过 WhatsApp (+65 8942 7926) 或邮件 (admin@jmedpass.com) 联系客服，提供您的注册手机号进行密码重置。';
  showToastMsg(msg, 'info');
});
</script>
</body>
</html>
