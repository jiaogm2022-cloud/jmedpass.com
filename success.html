<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>订单确认 | 日医通</title>
  <meta name="description" content="感谢您的购买，您的订单已确认。日医通将尽快为您处理。" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://jmedpass.com/success" />
  <meta property="og:title" content="订单确认 | 日医通" />
  <meta property="og:site_name" content="日医通 JMedPass" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: #f5f5f7; min-height: 100vh; display: flex; flex-direction: column; }
    .success-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
    }
    .success-card {
      background: #fff;
      border-radius: 28px;
      padding: 60px 48px;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 48px rgba(0,0,0,.10);
    }
    .success-icon {
      width: 88px;
      height: 88px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      box-shadow: 0 8px 24px rgba(16,185,129,.3);
    }
    .success-icon svg { width: 44px; height: 44px; }
    .success-card h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.9rem;
      color: #1a1018;
      margin-bottom: 12px;
    }
    .success-card .subtitle {
      color: #8a7080;
      font-size: .95rem;
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .order-ref {
      background: #f5f5f7;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 32px;
      font-size: .85rem;
      color: #5a3d52;
    }
    .order-ref strong { display: block; font-size: .78rem; color: #8a7080; margin-bottom: 4px; }
    .order-note {
      background: #fdf6f8;
      border: 1px solid #f2c4d0;
      border-radius: 16px;
      padding: 20px 22px;
      margin-bottom: 32px;
      text-align: left;
      color: #5a3d52;
      line-height: 1.7;
      font-size: .9rem;
    }
    .next-steps {
      background: #f0fdf4;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 32px;
      text-align: left;
    }
    .next-steps h3 { font-size: .85rem; color: #059669; font-weight: 600; margin-bottom: 12px; }
    .step-row { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; font-size: .85rem; color: #374151; line-height: 1.5; }
    .step-num {
      width: 22px; height: 22px; border-radius: 50%; background: #10b981; color: #fff;
      font-size: .72rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }
    .action-btns { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn-back-shop {
      flex: 1;
      display: inline-flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #9b2335, #e8637a, #c9974a);
      color: #fff; border: none; border-radius: 100px;
      padding: 14px 24px; font-size: .95rem; font-weight: 700;
      cursor: pointer; text-decoration: none;
      font-family: 'Noto Sans SC', sans-serif;
      box-shadow: 0 4px 16px rgba(155,35,53,.35);
      transition: all .25s;
    }
    .btn-back-shop:hover { opacity: .9; transform: translateY(-1px); }
    .btn-wa {
      flex: 1;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      background: #25d366; color: #fff; border: none; border-radius: 100px;
      padding: 14px 24px; font-size: .95rem; font-weight: 700;
      cursor: pointer; text-decoration: none;
      font-family: 'Noto Sans SC', sans-serif;
      box-shadow: 0 4px 16px rgba(37,211,102,.35);
      transition: all .25s;
    }
    .btn-wa:hover { opacity: .9; transform: translateY(-1px); }
    .loading-overlay {
      position: fixed; inset: 0; background: rgba(255,255,255,.95);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 999; gap: 16px;
    }
    .spinner {
      width: 48px; height: 48px; border: 3px solid #f2c4d0;
      border-top-color: #9b2335; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-overlay p { color: #5a3d52; font-size: .9rem; }
    @media (max-width: 600px) {
      .success-card { padding: 40px 24px; }
      .action-btns { flex-direction: column; }
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<header class="navbar scrolled" id="navbar">
  <div class="nav-inner">
    <a href="/" class="logo">
      <span class="logo-icon">⚕</span>
      <span class="logo-text" style="color:var(--dark)">日医通<em>JMEDPASS</em></span>
    </a>
    <nav class="nav-links" id="navLinks">
      <a href="/wellness" style="color:var(--primary);font-weight:700">生活方式商城</a>
    </nav>
  </div>
</header>

<!-- LOADING -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <p>正在确认您的订单…</p>
</div>

<!-- SUCCESS CONTENT -->
<div class="success-wrap">
  <div class="success-card" id="successCard" style="display:none">
    <div class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>支付成功！</h1>
    <p class="subtitle" id="successSubtitle">感谢您的购买。我们正在核对您的支付状态与订单信息。</p>

    <div class="order-ref">
      <strong>订单编号</strong>
      <span id="orderRef">—</span>
    </div>

    <div class="order-note">
      为保护您的隐私，订单明细不会在公开页面直接展示。
      如需确认发货、物流或收件信息，请通过 WhatsApp 联系客服，我们会在核验后协助处理。
    </div>

    <div class="next-steps">
      <h3>接下来会发生什么</h3>
      <div class="step-row"><div class="step-num">1</div><div>我们将在 <strong>1个工作日</strong> 内处理您的订单，并发送发货通知</div></div>
      <div class="step-row"><div class="step-num">2</div><div>商品从日本直采发货，<strong>标准配送约 7–14 个工作日</strong></div></div>
      <div class="step-row"><div class="step-num">3</div><div>如有任何问题，请通过 <strong>WhatsApp 或邮件</strong> 联系我们的客服</div></div>
    </div>

    <div class="action-btns">
      <a href="/wellness" class="btn-back-shop">继续购物 →</a>
      <a href="https://wa.me/6589427926?text=您好，我刚刚完成了订单，想了解发货进度。" target="_blank" rel="noopener noreferrer" class="btn-wa">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        联系客服
      </a>
    </div>
  </div>
</div>

<script>
(function () {
  document.getElementById('navbar').classList.add('scrolled');

  var params = new URLSearchParams(window.location.search);
  var sessionId = params.get('session_id');

  function showCard(orderInfo) {
    document.getElementById('loadingOverlay').style.display = 'none';
    document.getElementById('successCard').style.display = 'block';

    // Order ref
    if (sessionId) {
      document.getElementById('orderRef').textContent = sessionId.slice(-12).toUpperCase();
    }

    document.getElementById('successSubtitle').textContent =
      '感谢您的购买。我们已确认支付成功，订单处理进度可通过客服协助查询。';

    // Clear cart
    localStorage.removeItem('sm_cart');
  }

  if (!sessionId) {
    document.getElementById('loadingOverlay').style.display = 'none';
    document.getElementById('successCard').style.display = 'block';
    document.getElementById('successSubtitle').textContent = '缺少订单编号，请联系平台客服协助核对。';
    return;
  }

  fetch('/api/checkout-session-status?session_id=' + encodeURIComponent(sessionId), {
    credentials: 'same-origin'
  })
    .then(function (response) {
      return response.json().then(function (data) {
        if (!response.ok) throw new Error(data.error || 'query_failed');
        return data;
      });
    })
    .then(function (data) {
      if (data.payment_status !== 'paid') {
        throw new Error('payment_not_confirmed');
      }
      showCard(data);
    })
    .catch(function () {
      document.getElementById('loadingOverlay').style.display = 'none';
      document.getElementById('successCard').style.display = 'block';
      document.getElementById('successSubtitle').textContent = '支付状态暂未确认，请保留订单编号并联系平台客服核对。';
    });
})();
</script>
</body>
</html>
