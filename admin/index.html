<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 樱医集团后台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="login-page">

<div class="login-bg">
  <div class="login-blob b1"></div>
  <div class="login-blob b2"></div>
  <div class="login-blob b3"></div>
</div>

<div class="login-card">
  <div class="login-logo">
    <span class="login-logo-icon">⚕</span>
    <div>
      <span class="login-brand">樱医集团</span>
      <span class="login-sub">SAKURA MEDICAL GROUP</span>
    </div>
  </div>

  <h2 class="login-title">后台管理系统</h2>
  <p class="login-desc">请登录以访问数据管理控制台</p>

  <form class="login-form" id="loginForm" autocomplete="off">
    <div class="lf-group">
      <label for="loginUser">账号</label>
      <div class="lf-input-wrap">
        <svg class="lf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input id="loginUser" type="text" placeholder="请输入账号" autocomplete="username" />
      </div>
    </div>
    <div class="lf-group">
      <label for="loginPass">密码</label>
      <div class="lf-input-wrap">
        <svg class="lf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        <input id="loginPass" type="password" placeholder="请输入密码" autocomplete="current-password" />
        <button type="button" class="lf-eye" id="eyeBtn" title="显示/隐藏密码">
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="login-error" id="loginError" style="display:none">账号或密码错误，请重试</div>

    <button type="submit" class="login-btn" id="loginBtn">登 录</button>
  </form>

</div>

<script>
  // Already logged in → skip login
  if (localStorage.getItem('sm_admin_auth') === 'yes') {
    window.location.href = 'dashboard.html';
  }

  document.getElementById('eyeBtn').addEventListener('click', function () {
    var inp = document.getElementById('loginPass');
    var icon = document.getElementById('eyeIcon');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
      inp.type = 'password';
      icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  });

  var PASS_HASH = 'c4c0b99854f97f16ae681cb3c396f20858c2499c7b1c8f33cdad958c57f3958d';

  async function sha256(str) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  }

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var user = document.getElementById('loginUser').value.trim();
    var pass = document.getElementById('loginPass').value;
    var errEl = document.getElementById('loginError');
    var btn = document.getElementById('loginBtn');

    var hash = await sha256(pass);
    if (user === 'admin' && hash === PASS_HASH) {
      localStorage.setItem('sm_admin_auth', 'yes');
      btn.textContent = '登录成功，跳转中…';
      btn.disabled = true;
      setTimeout(function () { window.location.href = 'dashboard.html'; }, 600);
    } else {
      errEl.style.display = 'flex';
      document.getElementById('loginPass').value = '';
      document.getElementById('loginPass').focus();
      setTimeout(function () { errEl.style.display = 'none'; }, 3500);
    }
  });
</script>
</body>
</html>
