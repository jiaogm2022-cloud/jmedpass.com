[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# ── Static asset caching ──────────────────────────────
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML pages — no long-term cache (so updates land immediately)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Security headers ──────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://js.stripe.com; connect-src 'self' https://api.stripe.com https://*.netlify.app; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com"

# ── Netlify Functions CORS (handled per-request in function code) ──
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "POST, OPTIONS"

# ── Admin directory protection ────────────────────────
# Block directory listing — /admin and /admin/ return 404
[[redirects]]
  from = "/zaisheng"
  to = "/regenerative-medicine"
  status = 301
  force = true

[[redirects]]
  from = "/mianyi"
  to = "/immunotherapy"
  status = 301
  force = true

[[redirects]]
  from = "/ganxibao-kangshuai"
  to = "/stem-cell-anti-aging"
  status = 301
  force = true

[[redirects]]
  from = "/ganxibao-luanchao"
  to = "/ovarian-rejuvenation"
  status = 301
  force = true

[[redirects]]
  from = "/admin"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/admin/"
  to = "/404.html"
  status = 404

# ── 404 fallback ──────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
